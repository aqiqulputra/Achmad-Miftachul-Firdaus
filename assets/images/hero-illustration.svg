<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <!-- Athletic Track Curves -->
  <path d="M-50 400C120 400 240 320 320 200C400 80 500 40 650 40" stroke="#F47738" stroke-width="6" stroke-linecap="round" opacity="0.35" />
  <path d="M-20 420C140 420 260 340 340 220C420 100 520 60 670 60" stroke="#6A8F78" stroke-width="5" stroke-linecap="round" opacity="0.3" />
  <path d="M10 440C160 440 280 360 360 240C440 120 540 80 690 80" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 10" opacity="0.2" />

  <!-- Central Academic & Sports Composition Plate -->
  <rect x="120" y="80" width="360" height="260" rx="24" fill="#1E314B" stroke="rgba(244, 119, 56, 0.4)" stroke-width="2" />
  
  <!-- Subtle Grid inside Card -->
  <line x1="120" y1="140" x2="480" y2="140" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <line x1="120" y1="200" x2="480" y2="200" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <line x1="120" y1="260" x2="480" y2="260" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Clipboard & Lesson Plan Graphic -->
  <rect x="160" y="110" width="120" height="180" rx="12" fill="#F8F7F3" />
  <rect x="195" y="100" width="50" height="18" rx="6" fill="#F47738" />
  <circle cx="220" cy="106" r="3" fill="#FFFFFF" />
  <line x1="180" y1="140" x2="260" y2="140" stroke="#14243A" stroke-width="4" stroke-linecap="round" />
  <line x1="180" y1="160" x2="245" y2="160" stroke="#6A8F78" stroke-width="3" stroke-linecap="round" />
  <line x1="180" y1="180" x2="255" y2="180" stroke="#303640" stroke-width="2" stroke-linecap="round" />
  <line x1="180" y1="195" x2="250" y2="195" stroke="#303640" stroke-width="2" stroke-linecap="round" />
  <line x1="180" y1="210" x2="235" y2="210" stroke="#303640" stroke-width="2" stroke-linecap="round" />
  <circle cx="185" cy="245" r="8" fill="#F47738" />
  <path d="M182 245L185 248L189 242" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="202" y1="245" x2="255" y2="245" stroke="#14243A" stroke-width="3" stroke-linecap="round" />

  <!-- Whistle Graphic (Coach & Physical Educator) -->
  <g transform="translate(320, 120)">
    <circle cx="45" cy="50" r="28" fill="#F47738" />
    <path d="M45 22H90V46H68L55 35L45 35Z" fill="#F47738" />
    <rect x="75" y="26" width="12" height="14" rx="2" fill="#14243A" />
    <circle cx="45" cy="50" r="14" fill="#DF6426" />
    <circle cx="22" cy="50" r="6" stroke="#FFFFFF" stroke-width="3" fill="none" />
    <path d="M16 50C-10 50 -20 90 -4 130" stroke="#F8F7F3" stroke-width="3" stroke-dasharray="4 4" fill="none" />
  </g>

  <!-- Stopwatch / Timer Graphic -->
  <g transform="translate(340, 210)">
    <circle cx="40" cy="45" r="30" fill="#F8F7F3" stroke="#14243A" stroke-width="4" />
    <circle cx="40" cy="45" r="24" fill="#FFFFFF" />
    <!-- Ticks -->
    <line x1="40" y1="23" x2="40" y2="27" stroke="#14243A" stroke-width="3" />
    <line x1="62" y1="45" x2="58" y2="45" stroke="#14243A" stroke-width="3" />
    <line x1="40" y1="67" x2="40" y2="63" stroke="#14243A" stroke-width="3" />
    <line x1="18" y1="45" x2="22" y2="45" stroke="#14243A" stroke-width="3" />
    <!-- Needle pointing active -->
    <line x1="40" y1="45" x2="52" y2="33" stroke="#F47738" stroke-width="3" stroke-linecap="round" />
    <circle cx="40" cy="45" r="4" fill="#14243A" />
    <!-- Crown button -->
    <rect x="36" y="8" width="8" height="7" rx="2" fill="#14243A" />
  </g>

  <!-- Floating Badge: SD LAB UM -->
  <g transform="translate(100, 310)">
    <rect width="180" height="42" rx="21" fill="#FFFFFF" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))" />
    <circle cx="22" cy="21" r="14" fill="#6A8F78" />
    <path d="M16 21L20 25L28 17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="26" font-family="sans-serif" font-weight="bold" font-size="12" fill="#14243A">SD Laboratorium UM</text>
  </g>

  <!-- Floating Badge: PPG UM -->
  <g transform="translate(360, 50)">
    <rect width="170" height="40" rx="20" fill="#FFFFFF" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))" />
    <circle cx="20" cy="20" r="12" fill="#F47738" />
    <text x="16" y="24" font-family="sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">★</text>
    <text x="42" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#14243A">PPG Mandiri</text>
  </g>
</svg>

